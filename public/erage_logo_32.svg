<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a0a5c"/>
      <stop offset="60%" stop-color="#1a0530"/>
      <stop offset="100%" stop-color="#08000f"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd24d"/>
      <stop offset="45%" stop-color="#ff8a1a"/>
      <stop offset="100%" stop-color="#c43a00"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b066ff"/>
      <stop offset="100%" stop-color="#6a1fb8"/>
    </linearGradient>
  </defs>

  <!-- Background disc -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)" stroke="#2a0840" stroke-width="0.5"/>

  <!-- Purple outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#ring)" stroke-width="1.5"/>

  <!-- Outer triangle outline (ratchet symbol) -->
  <polygon points="16,5.5 25.5,21.5 6.5,21.5" fill="none" stroke="url(#flame)" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Inner flame triangle -->
  <polygon points="16,11 21.5,20 10.5,20" fill="url(#flame)" stroke="#ffe066" stroke-width="0.4" stroke-linejoin="round"/>

  <!-- Tiny highlight on flame -->
  <polygon points="16,13 18.5,18 13.5,18" fill="#ffec99" opacity="0.55"/>
</svg>
